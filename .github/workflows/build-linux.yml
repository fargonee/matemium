name: Build Linux Desktop

# Desktop app build strategy (commercial release artifact):
# - Full production builds (.deb + .AppImage) ONLY on version tags (v*) and manual dispatch.
# - Lightweight verification (engine smoke + cargo check) runs on PRs and main pushes
#   that touch relevant paths.
# - Full matrix: Linux + Windows + macOS (see build-windows.yml and build-macos.yml).
# - Path filters avoid wasting minutes when only website/ or unrelated server code changes.
# - Tag builds upload workflow artifacts; publish-release.yml assembles one draft release.
#
# This aligns with the project documentation: release pipeline uses tags.

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      # Changes that affect the desktop app or the matemium sidecar it embeds
      - 'desktop/**'
      - 'matemium/**'
      - 'canvas/**'
      - 'projects/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'fixtures/**'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'matemium/**'
      - 'canvas/**'
      - 'projects/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'fixtures/**'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, cheap verification job.
  # Runs for PRs and ordinary pushes to main (when path filter matches).
  # Skips the heavy PyInstaller + full Tauri bundle + texlive work.
  desktop-verify:
    if: (github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip desktop-verify]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal system deps for engine + tauri check
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential curl git pkg-config \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libcairo2-dev libpango1.0-dev \
            python3 python3-venv python3-pip \
            jq

      - name: Install engine (dev deps not required)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify engine imports + CLI smoke
        run: |
          python -c "import canvas, matemium; from matemium import __version__; print('Engine imports OK - version:', __version__)"
          matemium --version
          matemium list

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure dummy sidecar binary (for Tauri externalBin validation during cargo check)
        # The real binary is produced by build-linux.sh (PyInstaller) only for full builds.
        # For fast PR feedback we just need the path to exist so tauri-build doesn't fail.
        run: |
          mkdir -p desktop/src-tauri/binaries
          DUMMY_BIN="desktop/src-tauri/binaries/matemium-sidecar-x86_64-unknown-linux-gnu"
          if [ ! -f "$DUMMY_BIN" ]; then
            printf '#!/bin/sh\necho "matemium-sidecar (dummy for cargo check / PR verification)"\necho "version: 0.0.0-dummy"\n# In real builds the script in build-linux.sh overwrites this with the PyInstaller output.\n' > "$DUMMY_BIN"
            chmod +x "$DUMMY_BIN"
            echo "Created placeholder: $DUMMY_BIN"
          else
            echo "Sidecar placeholder already present: $DUMMY_BIN"
          fi

      - name: Cargo check (Rust side of desktop shell)
        working-directory: desktop/src-tauri
        run: cargo check

  # Full production build job.
  # Only executes for version tags and workflow_dispatch.
  # Expensive: full texlive, PyInstaller of manim/canvas/matemium, Tauri bundle.
  build-linux:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Determine version (from tag when applicable)
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            raw="${{ github.ref_name }}"
            ver="${raw#v}"
            echo "version=$ver" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Release version: $ver"
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Dispatch/manual build (no version override)"
          fi

      - name: Validate tagged release metadata
        if: steps.ver.outputs.is_release == 'true'
        run: python scripts/check_release.py "${{ github.ref_name }}"

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential curl git pkg-config \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libcairo2-dev libpango1.0-dev \
            python3 python3-venv python3-pip \
            ffmpeg \
            texlive-latex-extra texlive-fonts-extra texlive-science \
            cm-super dvipng dvisvgm \
            jq

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install engine + PyInstaller (matches build-linux.sh expectations)
        run: |
          python -m venv .venv
          if [ -f .venv/bin/pip ]; then
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -e ".[dev]" pyinstaller
          else
            .venv/Scripts/pip.exe install --upgrade pip
            .venv/Scripts/pip.exe install -e ".[dev]" pyinstaller
          fi
          echo "Venv ready at .venv"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Linux desktop artifacts
        # The script creates .venv (already prepared above), builds the real sidecar (PyInstaller),
        # installs it to binaries/ (overwriting any dummy), builds frontend, then cargo tauri build.
        run: ./desktop/scripts/build-linux.sh

      - name: Phase 10 - PAD readiness smoke (verify new commands, phases, manifest)
        run: bash ./desktop/scripts/verify-pad-readiness.sh

      - name: Phase 10 - Quick asset manifest presence check
        run: |
          test -f shared/assets/manifest.json
          echo "Asset manifest present"

      - name: Upload desktop bundles (as artifact)
        uses: actions/upload-artifact@v4
        with:
          name: matemium-linux-desktop-${{ steps.ver.outputs.version }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Summary
        run: |
          echo "✅ Linux desktop build finished."
          echo "Version used: ${{ steps.ver.outputs.version }}"
          echo "Artifact is ready for the Publish Desktop Release workflow."
