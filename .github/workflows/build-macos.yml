name: Build macOS Desktop

# Full cross-architecture support (Apple Silicon + Intel).
# - Verify job for fast PR feedback (dummy sidecar).
# - Full builds on v* tags and workflow_dispatch only.
# - Produces native .dmg / .app for each architecture.
# - Signing happens before bundling; Tauri notarizes when Apple secrets are present.

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - 'desktop/**'
      - 'matemium/**'
      - 'canvas/**'
      - 'projects/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'fixtures/**'
      - '.github/workflows/build-macos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'matemium/**'
      - 'canvas/**'
      - 'projects/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'fixtures/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    strategy:
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: macos-13
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal system deps for verification
        run: |
          brew install ffmpeg || true

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify engine
        run: python -c "import canvas, matemium; print('✅ Engine OK')"

      - name: Install Rust (with target for matrix)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Create dummy sidecar for Tauri (macOS)
        run: |
          mkdir -p desktop/src-tauri/binaries
          DUMMY="desktop/src-tauri/binaries/matemium-sidecar-${{ matrix.triple }}"
          if [ ! -f "$DUMMY" ]; then
            printf '#!/bin/sh\necho "matemium-sidecar dummy"\n' > "$DUMMY"
            chmod +x "$DUMMY"
          fi

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check --target ${{ matrix.triple }}

  build-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (primary)
          - os: macos-latest
            triple: aarch64-apple-darwin
            arch_name: arm64
          # Intel (for broad compatibility)
          - os: macos-13
            triple: x86_64-apple-darwin
            arch_name: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            raw="${{ github.ref_name }}"
            ver="${raw#v}"
            echo "version=$ver" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate tagged release metadata
        if: steps.ver.outputs.is_release == 'true'
        run: python scripts/check_release.py "${{ github.ref_name }}"

      - name: Install system dependencies (ffmpeg + MacTeX)
        run: |
          brew install --cask mactex-no-gui || true
          brew install ffmpeg || true
          # Make sure tex binaries are on PATH (mactex installs to /usr/local/texlive or /Library/TeX)
          echo "/Library/TeX/texbin" >> $GITHUB_PATH
          echo "/usr/local/texlive/2024/bin/universal-darwin" >> $GITHUB_PATH || true
          # Basic smoke
          which pdflatex || echo "pdflatex not immediately found (may need manual PATH in user env)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv + install engine + PyInstaller
        run: |
          python -m venv .venv
          if [ -f .venv/bin/pip ]; then
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -e ".[dev,intelligence]" pyinstaller
          else
            .venv/Scripts/pip.exe install --upgrade pip
            .venv/Scripts/pip.exe install -e ".[dev,intelligence]" pyinstaller
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Install Rust (with target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Set version (release tags)
        if: steps.ver.outputs.is_release == 'true'
        working-directory: desktop/src-tauri
        run: cargo tauri set-version "${{ steps.ver.outputs.version }}"

      - name: Configure macOS signing
        if: steps.ver.outputs.is_release == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "MACOS_NOTARIZE=false" >> "$GITHUB_ENV"
            echo "Apple credentials are absent; using an ad-hoc signature."
            exit 0
          fi

          if [[ -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Apple signing is partially configured. Set all five Apple secrets."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/matemium-build.keychain-db"
          KEYCHAIN_PASSWORD="matemium-ci-keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity found in certificate."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_NOTARIZE=true" >> "$GITHUB_ENV"
          echo "MATEMIUM_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build macOS desktop (native for ${{ matrix.triple }})
        env:
          MATEMIUM_TARGET_TRIPLE: ${{ matrix.triple }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./desktop/scripts/build-macos.sh

      - name: Verify macOS bundle signature and notarization
        if: steps.ver.outputs.is_release == 'true'
        run: |
          APP_PATH=$(find desktop/src-tauri/target -name "*.app" -type d -print -quit)
          DMG_PATH=$(find desktop/src-tauri/target -name "*.dmg" -type f -print -quit)
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          if [[ "$MACOS_NOTARIZE" == "true" ]]; then
            xcrun stapler validate "$DMG_PATH"
          fi

      - name: Remove temporary signing keychain
        if: always() && env.MATEMIUM_KEYCHAIN_PATH != ''
        run: security delete-keychain "$MATEMIUM_KEYCHAIN_PATH"

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: matemium-macos-${{ matrix.arch_name }}-${{ steps.ver.outputs.version }}
          path: |
            desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Summary
        run: |
          echo "✅ macOS (${{ matrix.arch_name }}) desktop build finished."
          echo "Version: ${{ steps.ver.outputs.version }}"
          echo "Artifact is ready for the Publish Desktop Release workflow."
