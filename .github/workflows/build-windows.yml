name: Build Windows Desktop

# Mirrors the proven Linux strategy for robustness and cost control.
# - Cheap verification (cargo check + dummy sidecar) on PRs.
# - Full production builds (.nsis + .msi) ONLY on version tags (v*) and manual dispatch.
# - Full release-debug builds can be run with windows-debug-* tags.
# - Sidecar **must** be built natively on Windows (PyInstaller).
#
# Expected outputs on release:
#   - Matemium_*.exe (NSIS installer)
#   - Matemium_*.msi

on:
  push:
    tags:
      - 'v*'
      - 'windows-debug-*'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'matemium/**'
      - 'canvas/**'
      - 'projects/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'fixtures/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast verification job — no heavy TeX or real sidecar.
  desktop-verify:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal Python deps (engine only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify engine imports
        run: python -c "import canvas, matemium; print('Engine imports OK')"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Create dummy sidecar for Tauri validation (Windows)
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          DUMMY="desktop/src-tauri/binaries/matemium-sidecar-x86_64-pc-windows-msvc.exe"
          if [ ! -f "$DUMMY" ]; then
            printf '#!/bin/sh\necho "matemium-sidecar (dummy for cargo check)"\n' > "$DUMMY"
            # On Windows the dummy can be a .exe shell script or just a marker.
            # Tauri mainly checks that the declared externalBin exists at build time.
            chmod +x "$DUMMY" || true
            echo "Created Windows dummy sidecar"
          fi

      - name: Cargo check (Rust side)
        working-directory: desktop/src-tauri
        run: cargo check

  # Full production build — expensive (PyInstaller + full deps).
  build-windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            raw="${{ github.ref_name }}"
            ver="${raw#v}"
            echo "version=$ver" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Debug/manual build (no release version override)"
          fi

      - name: Validate tagged release metadata
        if: steps.ver.outputs.is_release == 'true'
        shell: bash
        run: python scripts/check_release.py "${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (ffmpeg + MiKTeX for runtime in sidecar)
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress
          # MiKTeX is large and slow. Install portable/basic for build-time + runtime support.
          # If this step is too slow/unreliable in future, consider documenting user-installed TeX.
          choco install miktex -y --params="'/NoDesktopShortcuts /NoStartMenuShortcuts'" --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "MiKTeX install attempted (may require PATH refresh)"
            $global:LASTEXITCODE = 0
          }
          # Ensure common paths
          echo "C:\Program Files\MiKTeX\miktex\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\ffmpeg\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create venv and install engine + PyInstaller
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/python ]; then
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -e ".[dev]" pyinstaller
          else
            .venv/Scripts/python.exe -m pip install --upgrade pip
            .venv/Scripts/python.exe -m pip install -e ".[dev]" pyinstaller
          fi
          echo "Venv ready"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Windows desktop artifacts
        shell: bash
        env:
          MATEMIUM_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: |
          export PATH="/c/Program Files/MiKTeX/miktex/bin/x64:/c/Program Files/ffmpeg/bin:$PATH"
          bash ./desktop/scripts/build-windows.sh

      - name: Upload desktop bundles (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: matemium-windows-desktop-${{ steps.ver.outputs.version }}
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          echo "✅ Windows desktop build finished."
          echo "Version: ${{ steps.ver.outputs.version }}"
          echo "Artifact is ready for the Publish Desktop Release workflow."
