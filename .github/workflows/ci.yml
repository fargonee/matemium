name: CI

# Core matemium tool tests (engine + canvas + projects + shared).
# Requires Python >= 3.11 because of manim>=0.20.1.
# Triggered only on changes that affect the Python engine, canvas, tests, or shared.
# Pure website, desktop UI (app/), or unrelated changes do not run this.

on:
  push:
    branches: [main]
    paths:
      # Core matemium engine + canvas + shared
      - 'matemium/**'
      - 'canvas/**'
      - 'projects/**'
      - 'tests/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'fixtures/**'
      # Workflow itself
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'matemium/**'
      - 'canvas/**'
      - 'projects/**'
      - 'tests/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'fixtures/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (manimpango + full TeX for MathTex/dvisvgm)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libcairo2-dev \
            libpango1.0-dev \
            ffmpeg \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-science \
            cm-super \
            dvipng \
            dvisvgm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Verify CLI
        run: |
          matemium --version
          matemium list
