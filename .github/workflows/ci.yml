name: CI

# Core matemium tool tests (engine, canvas, projects, shared contracts).
# Server tests have moved to deploy-backend.yml (to gate actual deployments).
# Triggered only on changes that affect the Python engine, canvas, tests, or shared.
# Pure server changes, website, desktop UI (app/), or docs changes do not run this.

on:
  push:
    branches: [main]
    paths:
      # Core matemium engine + canvas + shared
      - 'matemium/**'
      - 'canvas/**'
      - 'projects/**'
      - 'tests/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'fixtures/**'
      # Workflow itself
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'matemium/**'
      - 'canvas/**'
      - 'projects/**'
      - 'tests/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'fixtures/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Verify CLI
        run: |
          matemium --version
          matemium list
