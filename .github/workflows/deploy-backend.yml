name: Deploy Backend to Northflank

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: math
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cancel any active builds (free tier limit)
        run: |
          echo "Cancelling any active or queued builds to free up the slot..."
          BUILDS=$(curl -s -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            "https://api.northflank.com/v1/projects/matemium/services/math/build" || echo '{}')
          ACTIVE=$(echo "$BUILDS" | jq -r '.data.builds[]? | select(.status == "PENDING" or .status == "BUILDING" or .status == "QUEUED") | .id' 2>/dev/null || echo "")
          for ID in $ACTIVE; do
            echo "Cancelling build $ID"
            curl -X DELETE -s -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
              "https://api.northflank.com/v1/projects/matemium/services/math/build/$ID" || true
          done

      - name: Trigger Northflank build from Git
        run: |
          echo "Triggering Northflank to build from Git (sha: ${{ github.sha }}) for project 'matemium' service 'math'..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.northflank.com/v1/projects/matemium/services/math/build" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sha": "${{ github.sha }}"
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Northflank API response: $BODY"
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Failed to trigger Northflank build"
            exit 1
          fi

          BUILD_ID=$(echo "$BODY" | jq -r '.data.id // ""')
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "Triggered build id: $BUILD_ID for sha ${{ github.sha }}"

          echo "✅ Build triggered successfully on Northflank."

      - name: Wait for build to succeed
        run: |
          echo "Waiting for build $BUILD_ID (sha ${{ github.sha }}) to succeed..."
          if [ -z "$BUILD_ID" ]; then
            echo "❌ No BUILD_ID captured from trigger step"
            exit 1
          fi
          for i in {1..60}; do   # up to ~20 minutes
            BUILD_INFO=$(curl -s -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
              "https://api.northflank.com/v1/projects/matemium/services/math/build/$BUILD_ID")
            echo "Build status check #$i: ${BUILD_INFO:0:300}..."
            STATUS=$(echo "$BUILD_INFO" | jq -r '.data.status // ""')
            echo "Current status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Build succeeded"
              echo "BUILD_SUCCEEDED=true" >> $GITHUB_ENV
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Build failed with status: $STATUS"
              exit 1
            fi
            sleep 20
          done

          if [ "${BUILD_SUCCEEDED}" != "true" ]; then
            echo "❌ Build did not reach SUCCESS in time (or status never confirmed)"
            exit 1
          fi

      - name: Deploy the specific build
        run: |
          echo "Deploying build $BUILD_ID (sha ${{ github.sha }}) to service..."
          if [ -z "$BUILD_ID" ]; then
            echo "❌ No BUILD_ID available for deploy"
            exit 1
          fi
          PAYLOAD="{\"internal\":{\"id\":\"math\",\"branch\":\"main\",\"buildId\":\"$BUILD_ID\"}}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.northflank.com/v1/projects/matemium/services/math/deployment" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Deploy response: $BODY"
          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Failed to deploy the build"
            exit 1
          fi

          echo "✅ Deploy triggered for the build."

      - name: Done
        run: |
          echo "✅ Build and deploy triggered for sha ${{ github.sha }} (buildId: $BUILD_ID)."
          echo "Check Northflank UI > service 'math' > Deployments to see the rollout."
          echo "No health check or job-failing logic."
