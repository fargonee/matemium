name: Deploy Backend to Northflank

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: math
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Northflank build from Git
        run: |
          echo "Triggering Northflank to build from Git (sha: ${{ github.sha }}) for project 'matemium' service 'math'..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.northflank.com/v1/projects/matemium/services/math/build" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sha": "${{ github.sha }}"
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Northflank API response: $BODY"
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Failed to trigger Northflank build"
            exit 1
          fi

          echo "✅ Build triggered successfully on Northflank."

      - name: Trigger Northflank build from Git
        run: |
          echo "Triggering Northflank to build from Git (sha: ${{ github.sha }}) for project 'matemium' service 'math'..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.northflank.com/v1/projects/matemium/services/math/build" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sha": "${{ github.sha }}"
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Northflank API response: $BODY"
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Failed to trigger Northflank build"
            exit 1
          fi

          echo "✅ Build triggered successfully on Northflank."

      - name: Deploy the specific build
        run: |
          SHA="${{ github.sha }}"
          echo "Deploying build $SHA to service..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.northflank.com/v1/projects/matemium/services/math/deployment" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "internal": {
                "id": "math",
                "branch": "main",
                "buildSHA": "'$SHA'"
              }
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Deploy response: $BODY"
          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Failed to deploy the build"
            exit 1
          fi

          echo "✅ Deploy triggered for the build."

      - name: Done (check Northflank UI)
        run: |
          echo "✅ Build and deploy triggered."
          echo "Check Northflank Deployments tab for the 'math' service to see the rollout."
          echo "No health check or rollback logic in this workflow."
