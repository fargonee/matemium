name: Deploy Backend to Northflank
# Zero-downtime + safe rollback deploy flow for Northflank
#
# Strategy:
# - Build from specific SHA
# - Deploy using the Northflank buildId
# - Platform-side rolling updates (when service has ≥2 instances + /health readiness probe)
# - GHA verifies the live /health endpoint after rollout
# - On verification failure → automatically redeploy the previous successful build, then fail the job
#
# Prerequisites for zero-downtime:
#   1. Northflank service "math" scaled to 2+ instances
#   2. Health check configured in UI: Readiness/Startup probe → /health
#   3. GitHub secret NORTHFLANK_APP_URL set to the public service URL (for live verification)
#
# Rollback is explicit in GHA so the pipeline reflects the failure state.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: math
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cancel any active builds (free tier limit)
        run: |
          echo "Cancelling any active or queued builds to free up the slot..."
          BUILDS=$(curl -s -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            "https://api.northflank.com/v1/projects/matemium/services/math/build" || echo '{}')
          ACTIVE=$(echo "$BUILDS" | jq -r '.data.builds[]? | select(.status == "PENDING" or .status == "BUILDING" or .status == "QUEUED") | .id' 2>/dev/null || echo "")
          for ID in $ACTIVE; do
            echo "Cancelling build $ID"
            curl -X DELETE -s -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
              "https://api.northflank.com/v1/projects/matemium/services/math/build/$ID" || true
          done

      - name: Trigger Northflank build from Git
        run: |
          echo "Triggering Northflank to build from Git (sha: ${{ github.sha }}) for project 'matemium' service 'math'..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.northflank.com/v1/projects/matemium/services/math/build" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sha": "${{ github.sha }}"
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Northflank API response: $BODY"
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Failed to trigger Northflank build"
            exit 1
          fi

          BUILD_ID=$(echo "$BODY" | jq -r '.data.id // ""')
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "Triggered build id: $BUILD_ID for sha ${{ github.sha }}"

          echo "✅ Build triggered successfully on Northflank."

      - name: Wait for build to succeed
        run: |
          echo "Waiting for build $BUILD_ID (sha ${{ github.sha }}) to succeed..."
          if [ -z "$BUILD_ID" ]; then
            echo "❌ No BUILD_ID captured from trigger step"
            exit 1
          fi
          succeeded=false
          for i in {1..60}; do   # up to ~20 minutes
            BUILD_INFO=$(curl -s -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
              "https://api.northflank.com/v1/projects/matemium/services/math/build/$BUILD_ID")
            echo "Build status check #$i: ${BUILD_INFO:0:300}..."
            STATUS=$(echo "$BUILD_INFO" | jq -r '.data.status // ""')
            echo "Current status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Build succeeded"
              succeeded=true
              echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Build failed with status: $STATUS"
              exit 1
            fi
            sleep 20
          done

          if [ "$succeeded" != "true" ]; then
            echo "❌ Build did not reach SUCCESS in time (or status never confirmed)"
            exit 1
          fi

      - name: Capture previous successful build (for safe rollback)
        run: |
          echo "Looking for previous successful build (different from $BUILD_ID)..."
          BUILDS=$(curl -s -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            "https://api.northflank.com/v1/projects/matemium/services/math/build")
          PREV_BUILD_ID=$(echo "$BUILDS" | jq -r '.data.builds[]? | select(.status == "SUCCESS" and .id != "'$BUILD_ID'") | .id' | head -1 || echo "")
          if [ -n "$PREV_BUILD_ID" ]; then
            echo "PREV_BUILD_ID=$PREV_BUILD_ID" >> $GITHUB_ENV
            echo "Previous good build for rollback: $PREV_BUILD_ID"
          else
            echo "No previous successful build found (first deploy?)"
          fi

      - name: Deploy the specific build
        run: |
          SHA="${{ github.sha }}"
          echo "Deploying build $BUILD_ID (sha $SHA) to service..."
          if [ -z "$BUILD_ID" ]; then
            echo "❌ No BUILD_ID available for deploy"
            exit 1
          fi
          PAYLOAD='{
            "internal": {
              "id": "math",
              "branch": "main",
              "buildId": "'$BUILD_ID'"
            },
            "runtimeEnvironment": {
              "COMMIT_SHA": "'$SHA'"
            }
          }'
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.northflank.com/v1/projects/matemium/services/math/deployment" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Deploy response: $BODY"
          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Failed to deploy the build"
            exit 1
          fi

          echo "✅ Deploy triggered for the build."

      - name: Verify deployment (live health checks) with safe rollback
        run: |
          SHA="${{ github.sha }}"
          echo "Verifying zero-downtime rollout for build $BUILD_ID (sha $SHA)..."

          APP_URL="${{ secrets.NORTHFLANK_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            echo "NORTHFLANK_APP_URL secret not set — trying to discover from Northflank service..."
            SVC=$(curl -s -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
              "https://api.northflank.com/v1/projects/matemium/services/math")
            # Common locations for the public URL
            APP_URL=$(echo "$SVC" | jq -r '
              .data.ports[]?.dns // .data.domains[0] // .data.dns // empty
            ' 2>/dev/null | head -1 || echo "")
            if [ -z "$APP_URL" ]; then
              APP_URL=$(echo "$SVC" | jq -r '.data | .. | strings | select(test("northflank.app$"))' 2>/dev/null | head -1 || echo "")
            fi
            if [ -n "$APP_URL" ] && [[ "$APP_URL" != http* ]]; then
              APP_URL="https://$APP_URL"
            fi
          fi

          if [ -z "$APP_URL" ]; then
            echo "⚠️  Could not determine live service URL."
            echo "   Set NORTHFLANK_APP_URL secret for live health verification + automatic rollback."
            echo "   Deploy considered successful based on Northflank build/deploy status only."
            exit 0
          fi

          echo "Using live URL for verification: $APP_URL"

          # Give the rolling update a head start (new containers start, health checked by platform)
          echo "Waiting for rollout to begin (30s grace)..."
          sleep 30

          # Poll live /health for up to ~5 minutes.
          # We expect 200 + status=ok. If COMMIT_SHA was applied it will also match.
          HEALTH_OK=false
          for i in {1..30}; do
            RESPONSE=$(curl -s --max-time 8 -w "\n%{http_code}" "$APP_URL/health" || echo "error\n000")
            BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP=$(echo "$RESPONSE" | tail -n1)

            echo "Health check #$i (HTTP $HTTP): ${BODY:0:200}"

            if [ "$HTTP" = "200" ] && echo "$BODY" | grep -q '"status":"ok"'; then
              # Optional strict commit check if the env made it through
              if echo "$BODY" | grep -q "$SHA" || echo "$BODY" | grep -q '"commit":"unknown"'; then
                echo "✅ Live service is healthy and serving (commit visible or unknown)"
                HEALTH_OK=true
                break
              else
                COMMIT=$(echo "$BODY" | jq -r '.commit // "n/a"' 2>/dev/null || echo "n/a")
                echo "Health OK but commit=$COMMIT (expected $SHA) — continuing to poll..."
              fi
            fi
            sleep 10
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "❌ Live health verification failed after timeout."
            if [ -n "$PREV_BUILD_ID" ]; then
              echo ">>> Initiating safe rollback to previous build: $PREV_BUILD_ID"
              ROLLBACK_PAYLOAD='{
                "internal": {
                  "id": "math",
                  "branch": "main",
                  "buildId": "'$PREV_BUILD_ID'"
                }
              }'
              curl -s -X POST \
                "https://api.northflank.com/v1/projects/matemium/services/math/deployment" \
                -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
                -H "Content-Type: application/json" \
                -d "$ROLLBACK_PAYLOAD" || true
              echo "Rollback triggered. Check Northflank UI."
            else
              echo "No previous build ID available for automatic rollback."
            fi
            echo "❌ Failing the deployment job for safety."
            exit 1
          fi

          echo "✅ Deployment verified live — zero-downtime rollout successful."

      - name: Done
        run: |
          echo "✅ Build + deploy + verification complete for sha ${{ github.sha }} (buildId: $BUILD_ID)."
          echo "Check Northflank UI > service 'math' > Deployments for rollout history."
          echo "For true zero-downtime: ensure ≥2 instances + /health readiness probe configured in Northflank."
