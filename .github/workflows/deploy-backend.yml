name: Deploy Backend to Northflank

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: math
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Northflank deployment from Git source
        run: |
          echo "Triggering Northflank to build and deploy from Git (branch: main) for project 'matemium' service 'math'..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.northflank.com/v1/projects/matemium/services/math/deployments" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "git": {
                "branch": "main"
              }
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Northflank API response: $BODY"
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Failed to trigger Northflank deployment"
            exit 1
          fi

          echo "✅ Deployment triggered successfully on Northflank. Build will start from Git source."

      - name: Wait for healthy deployment (stay on last successful if this fails)
        run: |
          echo "Waiting for Northflank deployment to become healthy (zero-downtime: previous version remains active until ready)..."
          sleep 60
          for i in {1..20}; do
            if curl -f -s https://p01--math--zjvwyx4fjqbn.code.run/health > /dev/null 2>&1; then
              echo "✅ Health check passed on attempt $i"
              exit 0
            fi
            echo "Health check $i failed, waiting 20s..."
            sleep 20
          done
          echo "❌ Health check failed after deployment. Previous version should still be serving (no promotion of bad deploy)."
          exit 1
