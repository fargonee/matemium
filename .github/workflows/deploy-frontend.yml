name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: math
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build (production)
        working-directory: website
        env:
          # Sensitive / key material — use Environment secrets (or repo secrets)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
          # Non-sensitive config — prefer Environment variables, fall back to secrets
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || secrets.VITE_SITE_URL }}
          VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS || secrets.VITE_ADMIN_EMAILS }}
          VITE_BASE: ${{ vars.VITE_BASE || secrets.VITE_BASE || '/' }}
        run: npm run build

      - name: Capture current production deployment (for rollback)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Capturing current deployment before new deploy..."
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/math/deployments?per_page=5")
          PREV_DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.result[0].id // ""')
          echo "PREV_DEPLOY_ID=$PREV_DEPLOY_ID" >> $GITHUB_ENV
          echo "Previous deployment ID: $PREV_DEPLOY_ID"
          echo "Current live URL will be preserved if new deploy fails verification."

      - name: Deploy to Cloudflare Pages (direct upload)
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying built assets to Cloudflare Pages project 'math' (branch: main)"
          DEPLOY_OUTPUT=$(npx wrangler@3 pages deploy dist \
            --project-name=math \
            --branch=main \
            --commit-dirty=true 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*\.pages\.dev' | tail -1 || echo "")
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "New deployment URL: $DEPLOY_URL"

      - name: Verify frontend deployment (zero downtime check) with rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Waiting for Cloudflare deployment to propagate and become stable..."
          sleep 30

          ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          TOKEN="$CLOUDFLARE_API_TOKEN"
          CUSTOM_URL="https://matemium.fargonee.space"

          # Prefer the specific new deployment URL (instant), fall back to custom
          VERIFY_URL="${DEPLOY_URL:-$CUSTOM_URL}"
          echo "Verifying URL: $VERIFY_URL (custom: $CUSTOM_URL)"

          VERIFIED=false
          for i in {1..20}; do
            HEADERS=$(curl -s -I --max-time 10 "$VERIFY_URL" || echo "")
            BODY=$(curl -s --max-time 10 "$VERIFY_URL" || echo "")

            STATUS=$(echo "$HEADERS" | head -1)

            # Use static content from index.html (SPA, so no JS-rendered text via curl)
            # The title is always present in the shell HTML
            HAS_STATIC=$(echo "$BODY" | grep -o "Matemium — Animated math lessons" | head -1 || echo "")

            if echo "$STATUS" | grep -q "200" && [ -n "$HAS_STATIC" ]; then
              echo "✅ Frontend deployment verified on attempt $i (static shell + 200 OK)"
              VERIFIED=true
              break
            fi

            echo "Verification $i not ready yet (status: $STATUS), waiting 15s..."
            sleep 15
          done

          # Optional: also quickly confirm custom domain is eventually serving (best effort)
          if [ "$VERIFY_URL" != "$CUSTOM_URL" ]; then
            echo "Checking custom domain as well..."
            CUSTOM_BODY=$(curl -s --max-time 10 "$CUSTOM_URL" || echo "")
            if echo "$CUSTOM_BODY" | grep -q "Matemium — Animated math lessons"; then
              echo "Custom domain also serving new content."
            else
              echo "Note: Custom domain may still be propagating old version (common with custom domains)."
            fi
          fi

          if [ "$VERIFIED" != "true" ]; then
            echo "❌ Frontend verification failed after deployment."

            if [ -n "$PREV_DEPLOY_ID" ]; then
              echo ""
              echo "=== SAFE ROLLBACK INSTRUCTIONS ==="
              echo "Previous deployment ID: $PREV_DEPLOY_ID"
              echo ""
              echo "To rollback immediately:"
              echo "1. Go to Cloudflare Dashboard > Pages > math > Deployments"
              echo "2. Find the deployment with ID $PREV_DEPLOY_ID"
              echo "3. Click the '...' menu > 'Rollback to this deployment'"
              echo ""
              echo "This will make the previous version the active production deployment again."
              echo "==================================="
            fi

            echo ""
            echo "❌ Failing the job. The new deployment may be live on the preview URL above."
            exit 1
          fi

          echo "✅ Frontend deployment verified — zero-downtime atomic switch successful."

      - name: Done
        run: |
          echo "✅ Frontend deploy complete (atomic + verified)."
          echo "Cloudflare Pages keeps all previous deployments — rollback is always available in the dashboard if needed."
