name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: math
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build (production)
        working-directory: website
        env:
          # Sensitive / key material — use Environment secrets (or repo secrets)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
          # Non-sensitive config — prefer Environment variables, fall back to secrets
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || secrets.VITE_SITE_URL }}
          VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS || secrets.VITE_ADMIN_EMAILS }}
          VITE_BASE: ${{ vars.VITE_BASE || secrets.VITE_BASE || '/' }}
        run: npm run build

      - name: Deploy to Cloudflare Pages (direct upload)
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying built assets to Cloudflare Pages project 'math' (branch: main)"
          npx wrangler pages deploy dist \
            --project-name=math \
            --branch=main \
            --commit-dirty=true

      - name: Verify frontend deployment (zero downtime check)
        run: |
          echo "Waiting for Cloudflare deployment to propagate..."
          sleep 60
          for i in {1..15}; do
            CONTENT=$(curl -s -I https://matemium.fargonee.space | head -1 || echo "")
            BODY=$(curl -s https://matemium.fargonee.space | grep -o "Matemium" | head -1 || echo "")
            if echo "$CONTENT" | grep -q "200" && [ -n "$BODY" ]; then
              echo "✅ Frontend deployment verified on attempt $i"
              exit 0
            fi
            echo "Verification $i failed (may be propagating), waiting 20s..."
            sleep 20
          done
          echo "❌ Frontend verification failed after deployment. Previous version should still be serving."
          exit 1
