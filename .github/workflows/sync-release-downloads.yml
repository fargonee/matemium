name: Sync Website Release Downloads

on:
  release:
    types: [published, edited, released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync, for example v0.3.0. Empty means latest.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-release-downloads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build downloads manifest from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p website/public/downloads

          if [[ -n "${RELEASE_TAG:-}" ]]; then
            gh release view "$RELEASE_TAG" \
              --json tagName,name,url,publishedAt,assets \
              --jq '{
                tagName,
                name: (.name // .tagName),
                htmlUrl: .url,
                publishedAt,
                assets: [
                  .assets[]
                  | select(.name | test("\\.(deb|AppImage|exe|msi|dmg)$"))
                  | {
                      id: (.id // 0),
                      name,
                      size,
                      browser_download_url: .url
                    }
                ]
              }' > website/public/downloads/latest.json
          else
            gh release list \
              --limit 1 \
              --exclude-drafts \
              --exclude-pre-releases \
              --json tagName \
              --jq '.[0].tagName' > /tmp/latest-release-tag
            gh release view "$(cat /tmp/latest-release-tag)" \
              --json tagName,name,url,publishedAt,assets \
              --jq '{
                tagName,
                name: (.name // .tagName),
                htmlUrl: .url,
                publishedAt,
                assets: [
                  .assets[]
                  | select(.name | test("\\.(deb|AppImage|exe|msi|dmg)$"))
                  | {
                      id: (.id // 0),
                      name,
                      size,
                      browser_download_url: .url
                    }
                ]
              }' > website/public/downloads/latest.json
          fi

          test "$(jq '.assets | length' website/public/downloads/latest.json)" -gt 0
          jq . website/public/downloads/latest.json

      - name: Commit manifest if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- website/public/downloads/latest.json; then
            echo "Downloads manifest already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/downloads/latest.json
          git commit -m "sync website release downloads"
          git push origin main
