name: Website CI

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

# Limit concurrent website CI runs
concurrency:
  group: "website-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Build job (production env validation on push / dispatch)
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck & build (with production env)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
          VITE_BASE: ${{ secrets.VITE_BASE }}
        run: npm run build

  # Keep a lightweight CI check on PRs that doesn't require secrets (uses placeholders)
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck & build (placeholders for PR validation)
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_SITE_URL: https://example.com
          VITE_API_URL: https://api.example.com
        run: npm run build