[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "matemium"
version = "0.1.0"
description = "Layout-to-animation compiler for math education videos on Manim"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Matemium contributors" }]
keywords = ["manim", "math", "education", "animation", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "manim>=0.20.1",
    "pillow>=12.0.0",
]

[project.optional-dependencies]
intelligence = [
    "lancedb>=0.5.0",
    "pyarrow>=15.0.0",
    "onnxruntime>=1.17.0",
    # For jina-embeddings-v2-base-code ONNX int8:
    # pip install "sentence-transformers[onnx]"
    "sentence-transformers>=3.0.0",
    # For MCP server
    "mcp>=0.1.0",
    # For GGUF local offline LLM inference:
    "llama-cpp-python>=0.2.75",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/matemium/matemium"
Documentation = "https://github.com/matemium/matemium#readme"
Repository = "https://github.com/matemium/matemium"
Issues = "https://github.com/matemium/matemium/issues"

[project.scripts]
matemium = "matemium.cli:main"
matemium-sidecar = "matemium.sidecar:main"

[tool.hatch.build.targets.wheel]
packages = ["canvas", "matemium"]

[tool.hatch.build.targets.sdist]
include = [
    "/canvas",
    "/matemium",
    "/projects",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/fixtures",
    "/canvas/USAGE.md",
    # Note: desktop/, server/, website/, shared/, and most root docs
    # are NOT part of the published Python engine package.
    # They are developed and deployed separately:
    #   - website/   → Cloudflare Pages
    #   - server/    → Northflank / PaaS (separate pyproject + Dockerfile)
    #   - desktop/   → Tauri bundles (separate packaging + sidecar build)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: full Manim render smoke tests (skipped in default CI)",
]

[tool.coverage.run]
source = ["canvas", "matemium"]
omit = ["tests/*"]
