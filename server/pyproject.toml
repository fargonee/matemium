[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "matemium-server"
version = "0.1.0"
description = "Matemium cloud middleware — auth, billing, chat LLM router"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[project.scripts]
matemium-server = "matemium_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["matemium_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]